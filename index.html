<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Doce</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <img src="img/logo.jpg" class="logo" alt="Logo">
    <h1>AC Doce</h1>
    <p>Doces artesanais feitos com amor ❤️</p>

    <input id="pesquisa" type="text" placeholder="Pesquisar produtos...">

    <div class="categorias">
        <button>Todos</button>
        <button>Cookies</button>
        <button>Pavês</button>
        <button>Pudins</button>
        <button>Açaí</button>
    </div>
</header>

<main id="produtos"></main>

<aside class="carrinho">
    <h2>🛒 Carrinho</h2>
    <div id="lista"></div>
    <strong id="total">R$ 0,00</strong>
    <button>Finalizar Pedido</button>
</aside>

<script src="script.js"></script>

</body>
</html>

<!-- O restante do projeto utiliza style.css e script.js
